#####################################################################
#   print_start macro
#####################################################################


[gcode_macro PRINT_START]
gcode:
    M118 —— macro PRINT_START
    # This part fetches data from your slicer. Such as bed temp, extruder temp, chamber temp and size of your printer.
    {% set target_bed = params.BED|int %}
    {% set target_extruder = params.EXTRUDER|int %}
    {% set target_chamber = params.CHAMBER|default("40")|int %}
    # {% set target_chamber_minimal = params.CHAMBER_MINIMAL|default("0")|int %}
    # {% set target_chamber_wait = [target_chamber, target_chamber_minimal]|select(">", 0)|min|default(0) %}
    {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

    # Checks if the nozzle temp is higher than 150c - if so then .
    {% if printer.extruder.temperature|int > 150 %}
        M118 —— Nozzle temp too high, wait for declined to 150c
        SET_DISPLAY_TEXT MSG="Nozzle temp too high, decline to 150c"         # Displays info
        M109 S150                                                            # Set nozzle temp target to 150 and wait                                     # Waits 5 min for the bedtemp to stabilize
    {% endif %}

    # Homes the printer, sets absolute positioning and updates the Stealthburner leds.
    STATUS_HOMING         # Sets SB-leds to homing-mode
    M118 —— Homing
    SET_DISPLAY_TEXT MSG="Homing"
    G28                   # Full home (XYZ)
    G90                   # Absolut position

    # Checks if the bed temp is higher than 90c - if so then trigger a heatsoak.
    {% if params.BED|int > 90 %}
        SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"           # Displays info
        STATUS_HEATING                                      # Sets SB-leds to heating-mode
        M106 S255                                           # Turns on the PT-fan

        ##  Uncomment if you have a Nevermore. k: not using this, nevermore_micro_fan will run if heater_bed is set above 60c.
        # SET_PIN PIN=nevermore_micro_fan VALUE=1             # Turns on the nevermore, to acclerate chamber heatup

        G1 X{x_wait} Y{y_wait} Z15 F9000                    # Goes to center of the bed

        M118 —— Target bed temp: {target_bed}
        SET_DISPLAY_TEXT MSG="target_bed: {target_bed}"    # Displays info
        M190 S{target_bed}                                  # Sets the target temp for the bed
        M118 —— Heatsoak chamber: {target_chamber}c
        SET_DISPLAY_TEXT MSG="heatsoak chamber: {target_chamber}c"  # Displays info
        # SET_TEMPERATURE_FAN_TARGET temperature_fan="chamber_fan" target={target_chamber}     # (K: will not wait, only set the temp)
        TEMPERATURE_WAIT SENSOR="temperature_fan chamber_fan" MINIMUM={target_chamber}   # Waits for chamber to reach desired temp (K: will wait)
        # TEMPERATURE_WAIT SENSOR="temperature_fan chamber_fan" MINIMUM=45   # use 45 instead, for abs target_chamber is 60 and too long to wait

    # If the bed temp is not over 90c, then it skips the heatsoak and just heats up to set temp with a 5min soak
    {% else %}
        STATUS_HEATING                                          # Sets SB-leds to heating-mode
        G1 X{x_wait} Y{y_wait} Z15 F9000                        # Goes to center of the bed

        M118 —— Target bed temp: {target_bed}, Soak 0 min
        SET_DISPLAY_TEXT MSG="Bed: {target_bed}c, Soak 0 min"    # Displays info
        #G4 P300000                                             # Waits 5 min for the bedtemp to stabilize
        M190 S{target_bed}                                      # Sets the target temp for the bed
    {% endif %}

    # Heating nozzle to 150 degrees. This helps with getting a correct Z-home
    M118 —— Target hotend temp: 150c
    SET_DISPLAY_TEXT MSG="Hotend: 150c"          # Displays info
    M109 S150                                    # Heats the nozzle to 150c

    ##  Uncomment for V2 (Quad gantry level AKA QGL)
    M118 —— QGL
    SET_DISPLAY_TEXT MSG="QGL"      # Displays info
    STATUS_LEVELING                 # Sets SB-leds to leveling-mode
    QUAD_GANTRY_LEVEL               # Levels the buildplate via QGL
    G28 Z                           # Homes Z again after QGL


    ##  Uncomment for bed mesh
    M118 —— Clear old bed mesh
    BED_MESH_CLEAR
    ;G1 X100 Y100 Z5 F6000
    M118 —— Adaptive bed mesh calibrate
    SET_DISPLAY_TEXT MSG="Bed meshing"    # Displays info
    STATUS_MESHING                     # Sets SB-leds to bed mesh-mode
    BED_MESH_CALIBRATE ADAPTIVE=1
    ;BED_MESH_CALIBRATE
    ;M118 —— Bed mesh load
    #BED_MESH_PROFILE LOAD=default    # no need to load after mesh calibration in macro, may produce unexpected results
    ;BED_MESH_PROFILE LOAD=default


    # Heats up the nozzle up to target via data from slicer
    M118 —— Target hotend temp: {target_extruder}
    SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"             # Displays info
    STATUS_HEATING                                                # Sets SB-leds to heating-mode
    G1 X{x_wait} Y{y_wait} Z15 F9000                              # Goes to center of the bed
    M107                                                          # Turns off partcooling fan
    M109 S{target_extruder}                                       # Heats the nozzle to printing temp

    # Enable smart filament sensor
    

    # Gets ready to print by doing a purge line and updating the SB-leds
    M118 —— Printing begins ...
    SET_DISPLAY_TEXT MSG="Printing begins ..."          # Displays info
    STATUS_PRINTING                                  # Sets SB-leds to printing-mode
    G0 X{x_wait - 50} Y4 F10000                      # Moves to starting point
    G0 Z0.4                                          # Raises Z to 0.4
    G91                                              # Incremental positioning
    G1 X100 E20 F1000                                # Purge line
    G90                                              # Absolut position


[gcode_macro PRINT_END]
gcode:
    M118 —— macro PRINT_END
    #SET_DISPLAY_TEXT MSG="PRINT_END"                 # Displays info
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 5, th.axis_maximum.z]|min %}

    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    # Disable smart filament sensor


    #RESETRGB                                                                             ; revert LCD RGB

    CLEAR_PAUSE                                                                          ; clear pause

    #M191 S0                                                                              ; (TEST) disable bed fans

    M400                                                                                 ; wait for buffer to clear
    G92 E0                                                                               ; zero the extruder
    G1 E-5.0 F1800                                                                       ; retract filament

    M104 S0                                                                              ; turn the hotend off
    M140 S0                                                                              ; turn the bed heater off
    #M140 S{printer["gcode_macro PRINT_START"].bedtemp|int}                              ; return the bed to temp, slicers like to turn it off
    #M141 S0                                                                             ; turn the chamber heater off (not implemented)

    G90                                                                                  ; absolute positioning
    G1 X{x_safe} Y{y_safe} Z{z_safe} F20000                                              ; move nozzle to remove stringing
    G1 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} Z{th.axis_maximum.z - 5} F3600   ; park nozzle at rear top

    M107                                                                                 ; turn off part cooling fan

    ;UPDATE_DELAYED_GCODE ID=DELAYED_SHUTDOWN DURATION=1800                               ; turn everything off in 30 min                                                                    ; reset speed, accel etc to configured max values
    ;SET_NOZZLE_LEDS_BY_NAME COLOR="OFF"
    SET_NOZZLE_LEDS_OFF; turn off nozzle LEDs

    ;BED_MESH_CLEAR

    BEEP I=3

    #M118 -> Done printing file.
    ;RESPOND MSG="Done printing file."
    SET_DISPLAY_TEXT MSG="Done printing file."                 # Displays info

    STATUS_READY


[delayed_gcode DELAYED_SHUTDOWN]
gcode:
    SHUTDOWN


[pause_resume]

# Pause and park toolhead at front center. Z hop by 10mm.
[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    M118 —— macro PAUSE
    #SET_DISPLAY_TEXT MSG="PAUSE"                 # Displays info

    # Parameters
    {% set z = params.Z|default(10)|int %}                                                  ; z hop amount

    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}                             ; set z hop variable for reference in resume macro
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}   ; set hotend temp variable for reference in resume macro

        # disable filament sensor

        SAVE_GCODE_STATE NAME=PAUSE                                                         ; save current print position for resume
        BASE_PAUSE                                                                          ; pause print
        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}      ; check that zhop doesn't exceed z max
            G91                                                                             ; relative positioning
            G1 Z{z} F900                                                                    ; raise Z up by z hop amount
        {% else %}
            { action_respond_info("Pause zhop exceeds maximum Z height.") }                 ; if z max is exceeded, show message and set zhop value for resume to 0
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}
        G90                                                                                 ; absolute positioning
        G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} F19500 ; park toolhead at front center
        SAVE_GCODE_STATE NAME=PAUSEPARK                                                     ; save parked position in case toolhead is moved during the pause (otherwise the return zhop can error)
        M104 S0                                                                             ; turn off hotend
        SET_IDLE_TIMEOUT TIMEOUT=43200                                                      ; set timeout to 12 hours
    {% endif %}


# warning: This resume macro will move directly back to its previous position. If using “complete individual objects” or “one at a time” in your slicer, ensure that the objects are printed from back to front on the build plate to avoid collisions on the return.
# Return Z hop back down, prime nozzle, resume print.
[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    M118 —— macro RESUME
    #SET_DISPLAY_TEXT MSG="RESUME"                 # Displays info

    # Parameters
    {% set e = params.E|default(2.5)|int %}                                          ; hotend prime amount (in mm)

    {% if printer['pause_resume'].is_paused|int == 1 %}

       #enable filament sensor

        RESETRGB                                                                    ; reset LCD color
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}  ; set timeout back to configured value
        {% if etemp > 0 %}
            M109 S{etemp|int}                                                        ; wait for hotend to heat back up
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100                     ; go back to parked position in case toolhead was moved during pause (otherwise the return zhop can error)
        G91                                                                          ; relative positioning
        M83                                                                          ; relative extruder positioning
        {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
            G1 Z{zhop * -1} E{e} F900                                                ; prime nozzle by E, lower Z back down
        {% else %}
            G1 Z{zhop * -1} F900                                                     ; lower Z back down without priming (just in case we are testing the macro with cold hotend)
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60 #100                          ; restore position
        BASE_RESUME                                                                  ; resume print
    {% endif %}


[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    M118 —— macro CANCEL_PRINT
    #SET_DISPLAY_TEXT MSG="CANCEL_PRINT"                 # Displays info

    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}      ; set timeout back to configured value
    CLEAR_PAUSE
    ;SDCARD_RESET_FILE
    PRINT_END
    BASE_CANCEL_PRINT



# Park at center of build volume
[gcode_macro PARKCENTER]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                           ; home if not already homed
    {% endif %}
    SAVE_GCODE_STATE NAME=PARKCENTER
    G90                               ; absolute positioning
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} Z{printer.toolhead.axis_maximum.z/2} F6000
    RESTORE_GCODE_STATE NAME=PARKCENTER

