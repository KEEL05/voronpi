# This file contains common pin mappings for the BigTreeTech Octopus V1.
# To use this config, the firmware should be compiled for the STM32F446 with a "32KiB bootloader"
# Enable "extra low-level configuration options" and select the "12MHz crystal" as clock reference

# after running "make", copy the generated "klipper/out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the OctoPus with that SD card.

# See docs/Config_Reference.md for a description of parameters.

## Voron Design VORON2 250/300/350mm BigTreeTech OctoPus V1 TMC2209 UART config

## *** THINGS TO CHANGE/CHECK: ***
## MCU paths                            [mcu] section
## Thermistor types                     [extruder] and [heater_bed] sections - See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types
## Z Endstop Switch location            [safe_z_home] section
## Homing end position                  [gcode_macro G32] section
## Z Endstop Switch  offset for Z0      [stepper_z] section
## Probe points                         [quad_gantry_level] section
## Min & Max gantry corner postions     [quad_gantry_level] section
## PID tune                             [extruder] and [heater_bed] sections
## Probe pin                            [probe] section
## Fine tune E steps                    [extruder] section



# K: Voron 2.4, Stealthburner Tap r8
# K: Dimension 380w*370d*490h
# K: Plate 220*220(200*200 printable)
# K: Printable height 175(180?)


#####################################################################
#   INCLUDES
#####################################################################

[include mainsail.cfg]
[include stealthburner_leds.cfg]
[include lcd_tweaks.cfg]
#[include timelapse.cfg]
#[include tune.cfg]
#[include AFC/*.cfg]

[virtual_sdcard]
# path: ~/printer_data/gcodes   ; already defined in mainsail.cfg
on_error_gcode: CANCEL_PRINT

# k : for listing/printing external usb stick on mini12864 lcd
# 1. add external_sdcard.py to ~/klipper/klippy/extras/
# 2. replace ~/klipper/klippy/extras/display/menu.py with modified menu.py
# 3. add '[menu __main __sdcard]' section with 'exsdlist' type to lcd_tweaks.cfg
# [external_sdcard]
# expath: ~/printer_data/gcodes/test
# on_error_gcode: CANCEL_PRINT


# ## Client variable macro from mainsail.cfg
# [gcode_macro _CLIENT_VARIABLE]
# variable_use_custom_pos   : False ; use custom park coordinates for x,y [True/False]
# variable_custom_park_x    : 0.0   ; custom x position; value must be within your defined min and max of X
# variable_custom_park_y    : 0.0   ; custom y position; value must be within your defined min and max of Y
# variable_custom_park_dz   : 2.0   ; custom dz value; the value in mm to lift the nozzle when move to park position
#variable_retract          : 1.0   ; the value to retract while PAUSE
#variable_cancel_retract   : 5.0   ; the value to retract while CANCEL_PRINT
#variable_speed_retract    : 35.0  ; retract speed in mm/s
#variable_unretract        : 1.0   ; the value to unretract while RESUME
#variable_speed_unretract  : 35.0  ; unretract speed in mm/s
#variable_speed_hop        : 15.0  ; z move speed in mm/s
#variable_speed_move       : 100.0 ; move speed in mm/s
#variable_park_at_cancel   : False ; allow to move the toolhead to park while execute CANCEL_PRINT [True/False]
#variable_park_at_cancel_x : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
#variable_park_at_cancel_y : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
## !!! Caution [firmware_retraction] must be defined in the printer.cfg if you set use_fw_retract: True !!!
#variable_use_fw_retract   : False ; use fw_retraction instead of the manual version [True/False]
#variable_idle_timeout     : 0     ; time in sec until idle_timeout kicks in. Value 0 means that no value will be set or restored
#gcode:


##  mcu firmware upgrade:
##  cd ~/klipper
##  'make clean'
##  'make menuconfig'
##  'make'
##  power off
##  install a jumper between BOOT0 and 3.3V (toggle dfu switch to down position)
##  'lsusb' (find the ID of the dfu device)
##  'make flash FLASH_DEVICE=1234:5678' (replace 1234:5678 with the real ID: 0483:df11)
##  power off
##  remove jumper between BOOT0 and 3.3V (toggle dfu switch to up position)
##  'ls /dev/serial/by-id'  should show similar to: usb_klipper_stm32f446xx_2E00xxxxxxxx_if00
[mcu]
# Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
#serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_2E0019000650534E4E313020-if00
serial: /dev/serial/by-id/usb-Klipper_stm32f429xx_3F002E001050325635383820-if00
# serial: /dev/ttyAMA0
restart_method: command


[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000                #Max 4000
max_z_velocity: 15             #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 300
square_corner_velocity: 6.0    #5.0


#####################################################################
#  Input Shaper (by adxl345)
#####################################################################
[input_shaper]
shaper_freq_x: 97.2
shaper_type_x: 2hump_ei
shaper_freq_y: 75.4
shaper_type_y: ei

#####################################################################
#  (also add [file_manager] enable_object_processing: True to 'moonraker.conf')
#####################################################################
[exclude_object]



#================================== DRIVES ==================================

# 4Z|A|B motor: Moons 17HDB401-01N, NEMA17(42x42mm), 1.8Deg, HoldingTorque:103oz-in, Weight:545g
# stepper motor test command: STEPPER_BUZZ STEPPER=stepper_x, STEPPER_BUZZ STEPPER=stepper_z, STEPPER_BUZZ STEPPER=stepper_z1...

#####################################################################
#   X/Y Stepper Settings
#####################################################################

##  B Stepper - Left
##  Connected to MOTOR_5
##  Endstop connected to DIAG_0
[stepper_x]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200  #set to 400 for 0.9 degree stepper
endstop_pin: PG6
position_min: 0
position_endstop: 200  ;k adj
position_max: 200  ;k adj
homing_speed: 25   #Max 100
homing_retract_dist: 5
homing_positive_dir: true

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_x]
uart_pin: PE4
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


##  A Stepper - Right
##  Connected to MOTOR_4
##  Endstop connected to DIAG_1
[stepper_y]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200  #set to 400 for 0.9 degree stepper
endstop_pin: PG9
position_min: 0
position_endstop: 200  ;k adj
position_max: 200   ;k adj
homing_speed: 25  #Max 100
homing_retract_dist: 5
homing_positive_dir: true

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_y]
uart_pin: PF2
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


#####################################################################
#   Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left
##  Connected to MOTOR_7
[stepper_z]
step_pin: PE6
dir_pin: PA14
enable_pin: !PE0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32  #only z use 32
endstop_pin: probe:z_virtual_endstop
position_max: 175      ; k adj, problem with 190
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z]
uart_pin: PD3
interpolate: false
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z1 Stepper - Rear Left
##  Connected to MOTOR_1
[stepper_z1]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z1]
uart_pin: PD11
interpolate: false
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z2 Stepper - Rear Right
##  Connected to MOTOR_3
[stepper_z2]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z2]
uart_pin: PC7
interpolate: false
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z3 Stepper - Front Right
##  Connected to MOTOR_6
[stepper_z3]
step_pin: PE2
dir_pin: !PE3
enable_pin: !PD4
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z3]
uart_pin: PE1
interpolate: false
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0


#================================== GANTRY ==================================

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800

[safe_z_home]
##  XY Location of the Z Endstop Switch
##  Update -10,-10 to the XY coordinates of your endstop pin
##  (such as 157,305) after going through Z Endstop Pin
##  Location Definition step.
home_xy_position: 100, 100  # K: for tap, it is the center
speed: 150
z_hop: 10

[quad_gantry_level]
##  Min & Max gantry corners - measure from nozzle at MIN (0,0) and
##  MAX (250, 250), (300,300), or (350,350) depending on your printer size
##  to respective belt positions
gantry_corners:
    -60,-10
    260, 270
##  Probe points
points:
    44,42      #54,52      #50,25
    44,162     #54,152     #50,125
    164,162    #154,152    #150,125
    164,42     #154,52     #150,25
speed: 100
horizontal_move_z: 10
retries: 6
retry_tolerance: 0.0075
max_adjust: 10

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
description: Conform a moving, twistable gantry to the shape of a stationary bed with klicky automount
gcode:
    _QUAD_GANTRY_LEVEL
    {% set x_center = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set y_center = printer.toolhead.axis_maximum.y|float / 2 %}
    G0 X{x_center} Y{y_center}



[axis_twist_compensation]
#speed: 50
#horizontal_move_z: 5
calibrate_x: 100
calibrate_start_x: 20
calibrate_end_x: 180
calibrate_y: 100
calibrate_start_y: 20
calibrate_end_y: 180



#================================== EXTRUDER ==================================

#####################################################################
#   Extruder
#####################################################################

##  Connected to MOTOR_2.2
##  Heater - HE0
##  Thermistor - PT100 #T0
[extruder]
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
##  Update value below when you perform extruder calibration
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
##  22.6789511 is a good starting point
#rotation_distance: 23.06 #23.06 for LDO 36STH20-1004AHGXH
rotation_distance: 22.90 #22.90 for moons cse14hra1l410a-01     ;22.6789511   #Bondtech 5mm Drive Gears
##  Update Gear Ratio depending on your Extruder Type
##  Use 50:10 for Stealthburner/Clockwork 2
##  Use 50:17 for Afterburner/Clockwork (BMG Gear Ratio)
##  Use 80:20 for M4, M3.1
gear_ratio: 50:10              #50:10 for Stealthburner/Clockwork 2
microsteps: 16
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: PA2
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for NTC 100k 3950 thermistors
sensor_type: MAX31865     #PT100 INA826
sensor_pin: PF8
spi_speed: 4000000
spi_software_sclk_pin: EXP2_2  #EXP2_2=PA5
spi_software_mosi_pin: EXP2_6  #EXP2_6=PA7
spi_software_miso_pin: EXP2_1  #EXP2_1=PA6
rtd_nominal_r: 100
rtd_num_of_wires: 2
rtd_reference_r: 430
rtd_use_50Hz_filter: True
min_temp: -5
max_temp: 360
max_power: 1.0
min_extrude_temp: 0
##  Compensation of long wire resistance for PT100 INA826
##  klipper-master/klippy/extras/adc_temperature.py
##  for PT100, resistances calc using Callendar-Van Dusen formula
##  r = 100.0 * (1. + A*t + B*t*t)), A, B = (3.9083e-3, -5.775e-7), t=(-40,-20,-10,0,10,20,...,500)
##  Standard circuit is 4400ohm pullup with 10x gain to 5V
##  v = 10. * 5. * r / (4400. + r))
##  extruder 24v heater wires using awg20 stranded tinned, measured wire resistance including connector = 3.8 ohm (TODO: measure real wire resistance )
##  v_offset = 10. * 5. * r_wire / (4400+100+r_wire) = 0.042
##  measured wire resistance: 230mohm *2
# adc_voltage: 5.0
# voltage_offset: -0.042
#max_extrude_cross_section: 50
#max_extrude_only_distance: 400
#max_extrude_only_velocity: 120    # <- for orbiter motor LDO-36STH20-1004AHG(XH)
#max_extrude_only_accel: 800       # <- for orbiter motor LDO-36STH20-1004AHG(XH)
control = pid
pid_Kp = 19.996
pid_Ki = 1.294
pid_Kd = 77.234
##  how calibrate heater pid:
##  2. Move your hothend to the center and 5-10 mm above bed
##  3. Set fans to 25%: "M106 S64"
##  4. Run: "PID_CALIBRATE HEATER=extruder TARGET=245"
##  5. This will run for a few minutes. When finished, save with: "SAVE_CONFIG"
##  pid_Kp=19.996 pid_Ki=1.294 pid_Kd=77.234 using: PID_CALIBRATE HEATER=extruder TARGET=340, bronze heatblock, default_nozzl, without silicone sock, 24v80w heater
##  pid_Kp=22.791 pid_Ki=1.288 pid_Kd=100.850 using: PID_CALIBRATE HEATER=extruder TARGET=295, default_nozzl with silicone sock, 24v65w heater (70w actually 65w)
##  pid_Kp=22.466 pid_Ki=1.291 pid_Kd=97.727 using: PID_CALIBRATE HEATER=extruder TARGET=295, default_nozzl without silicone sock, 24v65w heater (70w actually 65w)
##  Try to keep pressure_advance below 1.0
#pressure_advance: 0.042    #need to update                     # using orcaslicer calibration - DDE + PA Line 0-0.1 step0.002 (using kexcelled k5 abs)
pressure_advance: 0.042     #need to update                     # 20mm*0.002   using orcaslicer calibration - DDE+ PA Tower 0-0.1 step 0.002 (using kexcelled k5 abs)
#pressure_advance: 0.032                                       # 16mm*0.002   using orcaslicer calibration - DDE+ PA Tower 0-0.1 step 0.002 (using Sunlu abs)
#pressure_advance: 0.0525   #need to update                     # 0 + 10.5*0.005 = 0.0525 using klipper recommended tower method (using pla)
#pressure_advance: 0.0525   #need to update                     # 0 + 21*0.0025 = 0.0525 using ellis' adjusted tower method (using pla)
##  Default is 0.040, leave stock
pressure_advance_smooth_time: 0.040


# E motor: LDO 36STH20-1004AHGXH  #Moons cse14hra1l410a-01
# stepper motor test command: STEPPER_BUZZ STEPPER=extruder
##  E0 on MOTOR2.2
##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 extruder]
uart_pin: PC6
interpolate: true
run_current: 0.4      ;0.35A can support 300m/s speed(=300*0.4*0.2=24mm3/s) ????
sense_resistor: 0.110
stealthchop_threshold: 0


#================================== BED ==================================

#####################################################################
#   Bed Heater
#####################################################################

##  SSR Pin - HE1
##  Thermistor - TB
[heater_bed]
##  Uncomment the following line if using the default SSR wiring from the docs site
#heater_pin: PA3
##  Other wiring guides may use BED_OUT to control the SSR. Uncomment the following line for those cases
heater_pin: PA1
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for Keenovo heaters
sensor_type: Generic 3950
sensor_pin: PF3
##  Adjust Max Power so your heater doesn't warp your bed. Rule of thumb is 0.4 watts / cm^2 .
max_power: 0.8  ; 0.9 can't succeed
min_temp: 0
max_temp: 125
control: pid
pid_Kp: 52.726
pid_Ki: 1.821
pid_Kd: 381.602
#pid_Kp=52.726 pid_Ki=1.821 pid_Kd=381.602, PID_CALIBRATE HEATER=heater_bed TARGET=113  with max power 0.9 nevermore-micro on
#pid_kp: 52.113 pid_ki: 1.997 pid_kd: 340.034  without nevermore-micro
#pid_Kp: 58.599 pid_Ki: 2.271 pid_Kd: 377.961  using: PID_CALIBRATE HEATER=heater_bed TARGET=115  with max power 0.9 nevermore-micro on
#pid_Kp: 53.648 pid_Ki: 1.882 pid_Kd: 382.245  using: PID_CALIBRATE HEATER=heater_bed TARGET=110  with max power 0.8 nevermore-micro on
#pid_Kp: 60.295 pid_Ki: 2.393 pid_Kd: 379.855  using: PID_CALIBRATE HEATER=heater_bed TARGET=115  with max power 0.9 nevermore-micro on

[verify_heater heater_bed]
check_gain_time: 60    # The default is 20 seconds for extruders and 60 seconds for heater_bed, use larger values for more time before an error is reported


#####################################################################
#   Bed Mesh
#####################################################################

[bed_mesh]
speed: 50 #120
horizontal_move_z: 5
mesh_min: 25, 25
mesh_max: 175, 175
zero_reference_position: 100, 100
probe_count: 7, 7    ;set to probe the czero_ref_point(100,100), step=(175-25)/(7-1)=25
mesh_pps: 2, 2
algorithm: bicubic
bicubic_tension: 0.2
move_check_distance: 5
# split_delta_z: .025
# fade_start: 1
# fade_end: 10
# fade_target: 0
adaptive_margin: 5


#================================== FAN ==================================

#####################################################################
#   Fan Control
#####################################################################

##  Print Cooling Fan - FAN0
[fan]
pin: PA8    #octopus pro v1.0 fan0
kick_start_time: 0.5
##  Depending on your fan, you may need to increase this value
##  if your fan will not start. Can change cycle_time (increase)
##  if your fan is not able to slow down effectively
off_below: 0.10

##  Hotend Fan - FAN1
[heater_fan hotend_fan]
pin: PE5    #octopus pro v1.0 fan1
max_power: 1.0
shutdown_speed: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
fan_speed: 1.0      #  If you are experiencing back flow, you can reduce fan_speed

## Side Skirt Fan - Electronics Cooling Fan
[temperature_fan mcu_fan]
pin: PD12      #octopus pro v1.0 fan2
# max_power: 0.6
#off_below: 0.10
sensor_type: temperature_mcu
control: watermark
min_temp: 0
max_temp: 55
target_temp: 40.0
max_speed: 1.0
min_speed: 0.3

##  Nevermore fan - Nevermore Micro Fan(under heatbed)
[heater_fan nevermore_micro_fan]
pin: PD13       #octopus pro v1.0 fan3
max_power: 1.0
shutdown_speed: 1.0
kick_start_time: 0.5
heater: heater_bed
heater_temp: 60.0     #run nevermore_micro_fan to help heat soaking chamber, if set heater_bed to higher than 60c
fan_speed: 1.0


## Exhaust Fan - Chamber Negative Pressure Fan (TH1)
[temperature_fan chamber_fan]
pin: PD14     #octopus pro v1.0 fan4
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 0.5
sensor_type: Generic 3950
sensor_pin: PF4
min_temp: 0
max_temp: 75
target_temp: 30.0
max_speed: 1.0
min_speed: 0.3
control: watermark
gcode_id: C
# Add another section with a new macro.
[gcode_macro M141]
gcode:
    {% set s = params.S|default(0)|float %}
    M118 —— m141_wait_for_chamber_fan_to_{s}c
    SET_TEMPERATURE_FAN_TARGET temperature_fan="chamber_fan" target={s}


#================================== SENSORS ==================================

#####################################################################
#   Chamber Temperature
#####################################################################

# [temperature_sensor chamber]
# sensor_type: Generic 3950    # NTC 100K MGB18-104F39050L32
# sensor_pin: PF4
